<script>
const defaultSections=["Agile Foundations","Scrum Framework","Backlog, Stories & Estimation","Roadmaps & Release Planning","Frameworks at Scale","SDLC & Waterfall","DevOps, CI/CD & Release Engineering","Cloud & Infrastructure","APIs, Auth & Data","Architecture & System Design","Monitoring, Incidents & Production Support","Technical Debt & Quality Assurance","Security & Compliance","Delivery Metrics & DORA","Delivery Tooling","AI in Software Delivery","Scenario, Troubleshooting & Case Study"];
const catMap={0:"Agile",1:"Agile",2:"Agile",3:"Metrics",4:"Agile",5:"Architecture",6:"DevOps",7:"Architecture",8:"Data",9:"Architecture",10:"Ops",11:"QA",12:"Architecture",13:"Metrics",14:"Metrics",15:"Metrics",16:"Scenario"};
const rawData=[
[1,0,"What is the core difference between being Agile and doing Agile?","Doing Agile means following ceremonies and artifacts. Being Agile means applying the mindset: customer value, transparency, adaptation, empowered teams, short feedback loops, and outcome-driven decisions."],
[2,0,"Explain the four values of the Agile Manifesto and how you apply them in practice.","I prioritize people over process, working increments over heavy documentation, customer collaboration over contract negotiation, and adapting plans over blindly following them. In practice, I keep documentation useful, demo frequently, invite stakeholder feedback, and re-plan based on evidence."],
[3,0,"How would you coach a team that follows Scrum ceremonies but is not actually agile?","I would inspect whether ceremonies create decisions, learning, and adaptation. Then I would reconnect the team to outcomes, improve psychological safety, make impediments visible, and turn retrospectives into owned experiments."],
[4,0,"What are the twelve Agile principles, and which three matter most for delivery managers?","The principles cover early delivery, welcoming change, frequent working software, business/dev collaboration, motivated teams, face-to-face communication, working software as progress, sustainable pace, technical excellence, simplicity, self-organization, and regular reflection. For delivery managers, early continuous delivery, sustainable pace, and inspect/adapt are usually most critical."],
[5,0,"How do you balance predictability with agility?","I use rolling-wave planning: firm commitments for the near term, forecast ranges for later work, and transparent assumptions. I protect cadence, manage scope trade-offs explicitly, and communicate confidence levels instead of pretending uncertainty does not exist."],
[6,0,"What is the difference between Agile and iterative development?","Iterative development is a delivery technique where work evolves through repeated cycles. Agile is broader: a value system and management approach that often uses iteration, but also emphasizes customer collaboration, adaptation, team autonomy, and continuous improvement."],
[7,0,"When would Agile not be the right approach for a project?","Pure Agile may be less suitable where scope, sequence, and compliance gates are fixed and uncertainty is low, such as some regulatory filings, hardware-bound programs, or repeatable implementation work. Even then, agile feedback practices can still help."],
[8,0,"How do you measure whether an agile transformation is working?","I look at outcomes: lead time, cycle time, predictability, defect leakage, customer satisfaction, deployment frequency, engagement, and ability to respond to change. Ceremony attendance alone proves process adoption, not agility."],
[9,1,"What are the three pillars of Scrum empiricism?","Transparency, inspection, and adaptation. Work and progress must be visible, inspected frequently, and adjusted based on what is learned."],
[10,1,"List the five Scrum events and their timeboxes for a two-week sprint.","Sprint, Sprint Planning up to 4 hours, Daily Scrum 15 minutes, Sprint Review up to 2 hours, and Sprint Retrospective up to 1.5 hours. The Sprint itself is the container for all events."],
[11,1,"What are the three Scrum accountabilities?","Product Owner, Scrum Master, and Developers. Together they form one Scrum Team accountable for creating a valuable, usable Increment every Sprint."],
[12,1,"Explain the purpose of the Sprint Goal and why a sprint should have only one.","The Sprint Goal gives the team a single objective and decision filter. One goal creates focus and enables scope trade-offs without losing the purpose of the Sprint."],
[13,1,"What happens if a team fails to meet the Sprint Goal?","It should trigger transparency and learning, not blame. The team inspects causes, communicates impact, adapts the Product Backlog if needed, and agrees improvement actions in the retrospective."],
[14,1,"What is the difference between the Product Backlog and Sprint Backlog?","The Product Backlog is the ordered, evolving list of all product work. The Sprint Backlog is the Developers' selected work plus plan for achieving the Sprint Goal."],
[15,1,"Who owns the Sprint Backlog during the sprint?","The Developers own it. They adapt it daily as they learn more, while preserving alignment to the Sprint Goal and collaborating with the Product Owner on scope trade-offs."],
[16,1,"What is the purpose of the Daily Scrum, and why is status update to the Scrum Master a misuse?","The Daily Scrum is for Developers to inspect progress toward the Sprint Goal and adjust their plan. It is not a reporting meeting to the Scrum Master; that turns ownership away from the team."],
[17,1,"How would you run a Daily Scrum for a distributed team across four time zones?","I would use async updates for routine coordination, a rotating overlap window for live discussion when needed, and clear blockers/escalations. The goal is alignment without destroying focus or fairness."],
[18,1,"What is the purpose of Sprint Review versus a demo?","A demo shows completed functionality. A Sprint Review is a collaborative inspection of the Increment, market context, stakeholder feedback, and Product Backlog adjustments."],
[19,1,"What makes a Sprint Retrospective effective versus just a complaint session?","It creates psychologically safe, fact-based discussion and ends with a small number of owned, measurable improvement actions. Complaints become useful only when converted into experiments or escalated impediments."],
[20,1,"How do you handle a retrospective where the same unresolved issue appears every sprint?","I classify it as an organizational impediment if outside the team's control, assign an owner, escalate transparently, track it outside the retro, and report progress until resolved or consciously accepted."],
[21,1,"What is the Definition of Done and who owns it?","The Definition of Done is the shared quality standard required for work to become part of the Increment. The Scrum Team owns it, and organizational standards may set a minimum baseline."],
[22,1,"What is the Definition of Ready, and is it an official Scrum artifact?","Definition of Ready is an optional working agreement describing when a backlog item is clear enough to pull into a Sprint. It is not an official Scrum artifact and should not become a rigid gate."],
[23,1,"Explain the difference between a Scrum Master and a Project Manager.","A Scrum Master enables Scrum, removes impediments, coaches, and protects empiricism. A traditional Project Manager often directly manages scope, schedule, budget, risks, and reporting."],
[24,1,"What are the three commitments associated with Scrum artifacts?","Product Goal commits the Product Backlog, Sprint Goal commits the Sprint Backlog, and Definition of Done commits the Increment."],
[25,1,"How do you handle a Product Owner who is unavailable most of the sprint?","I make the delivery risk visible, agree required response times and decision rights, use a qualified proxy only if empowered, and escalate if backlog quality or team flow is materially harmed."],
[26,1,"What is a Product Goal and how does it differ from a Sprint Goal?","The Product Goal is a longer-term objective guiding the Product Backlog. The Sprint Goal is a short-term objective for one Sprint that moves the product toward that larger goal."],
[27,1,"Can Scrum work with a team of two developers? What would you watch for?","It can work, but skill coverage, review depth, resilience, and single points of failure are risks. I would keep events lightweight and ensure external support for missing capabilities."],
[28,1,"How would you handle a stakeholder who attends Daily Scrum and starts directing the team?","I would respectfully intervene, restate the event purpose, invite them to observe silently if appropriate, and redirect direction-setting to Product Owner conversations or Sprint Review."],
[29,1,"What is the maximum recommended Scrum Team size and why does it matter?","The Scrum Guide recommends a Scrum Team of 10 or fewer people. Beyond that, communication paths, coordination overhead, and loss of focus increase sharply."],
[30,1,"How do you handle zombie Scrum?","I diagnose why events are not producing learning: low autonomy, poor safety, weak Product Ownership, or ceremony fatigue. Then I simplify the process and reconnect each event to decisions and outcomes."],
[31,2,"What makes a Product Backlog DEEP?","It is Detailed appropriately, Estimated, Emergent, and Prioritized or ordered. Near-term items are clearer; future items remain coarse and adaptable."],
[32,2,"What is the difference between backlog grooming and backlog refinement?","They refer to the same activity: clarifying, splitting, estimating, ordering, and preparing backlog items. Refinement is the preferred modern term."],
[33,2,"What is INVEST for user stories?","Independent, Negotiable, Valuable, Estimable, Small, and Testable. It helps ensure stories can be delivered and validated within a Sprint."],
[34,2,"Write the standard user story template and explain each component.","As a role, I want capability, so that benefit. The role identifies the user, the capability states the need, and the benefit clarifies business or user value."],
[35,2,"Name four techniques for splitting a large user story.","Split by workflow step, business rule, happy path versus edge cases, data variation, CRUD operation, user role, interface, or platform."],
[36,2,"What is Story Mapping and why is it useful for release planning?","Story Mapping visualizes the user journey horizontally and prioritizes slices vertically. It exposes MVP scope, dependencies, gaps, and release increments better than a flat backlog."],
[37,2,"What is the difference between Acceptance Criteria and Definition of Done?","Acceptance Criteria define story-specific behavior and validation. Definition of Done is the universal quality bar applied to all completed work."],
[38,2,"How would you write acceptance criteria using Given/When/Then?","Use Given for context, When for the action, and Then for the expected result. Example: Given a valid user, When they reset a password, Then a secure reset link is emailed."],
[39,2,"Why do teams use story points instead of hours?","Story points estimate relative size, complexity, risk, and uncertainty. They reduce false precision and support forecasting using team-specific historical velocity."],
[40,2,"Compare T-shirt sizing, Planning Poker, and Affinity Estimation.","T-shirt sizing is fast and coarse. Planning Poker is collaborative and exposes disagreement. Affinity Estimation is efficient for many items by grouping relative sizes."],
[41,2,"How does Planning Poker prevent anchoring bias?","Team members choose estimates privately and reveal simultaneously, preventing the first or most senior opinion from anchoring everyone else."],
[42,2,"How do you calculate sprint capacity accounting for holidays and leave?","Start with available person-days, subtract planned absences and ceremonies, then apply a historical focus factor. Compare capacity to average completed work, not theoretical hours."],
[43,2,"Explain velocity versus throughput.","Velocity is story points completed per Sprint. Throughput is the number of work items completed per period, often used in flow/Kanban systems."],
[44,2,"Why is it risky to compare velocity across teams?","Story points are relative to each team's context, skills, and estimation calibration. Comparing velocities encourages gaming and false productivity conclusions."],
[45,2,"What does a flat burndown chart early in a sprint usually indicate?","It usually means too much work is in progress, stories are not sliced small enough, testing is delayed, or Done is only reached near the end."],
[46,2,"Why do many experienced teams prefer burnup charts?","Burnup charts show completed work and total scope separately, making scope change visible. Burndowns can hide scope creep because the target line moves."],
[47,3,"What is the difference between a product roadmap and a delivery/release plan?","A roadmap communicates strategic themes, outcomes, and sequencing. A release plan translates near-term roadmap intent into concrete scope, dates, dependencies, and readiness criteria."],
[48,3,"How would you build a three-sprint release plan for a major feature?","Define MVP and success criteria, slice work by value, sequence dependencies, allocate capacity by Sprint, include testing/hardening, identify risks, and agree release criteria."],
[49,3,"How do you handle a release plan when a critical dependency timeline is unknown?","I log it as a risk, request a commitment date, model scenarios, create contingency scope or mocks, and communicate confidence ranges instead of a false fixed plan."],
[50,3,"In SAFe, what is PI Planning and why face-to-face when possible?","PI Planning aligns teams on objectives, dependencies, risks, and capacity for an 8-12 week Program Increment. Face-to-face or high-bandwidth interaction improves negotiation and shared understanding."],
[51,3,"What are PI objectives and how are they scored?","PI objectives are team and program goals for the increment. Business Owners assign business value, teams confidence-vote, and actual achievement is reviewed at PI end."],
[52,3,"What is the distinction between Epic, Feature, and Story?","An Epic is a large initiative often spanning quarters or PIs. A Feature should fit in a PI. A Story should fit in a Sprint and deliver user value."],
[53,3,"How do you report progress on a multi-quarter epic to executives?","I report milestone progress, outcome metrics, spend/burn, risks, dependencies, forecast confidence, and decisions needed. I avoid raw story counts as the primary executive measure."],
[54,3,"How do you decide when a feature is released versus code complete?","Code complete means implementation is finished. Released means deployed, enabled for intended users, operationally monitored, supported, and validated against release criteria."],
[55,3,"What tooling or artifacts visualize cross-team dependencies at scale?","Program boards, dependency maps, RAID logs, integrated Jira/Azure dependency views, architecture roadmaps, and milestone plans with explicit owners and dates."],
[56,3,"How would you run a Scrum of Scrums and what should it not become?","I focus it on inter-team dependencies, blockers, integration risks, and decisions. It should not become a generic status meeting where each team reads updates."],
[57,3,"How do you prevent two teams from building conflicting solutions?","Create shared backlog visibility, architecture forums, ownership maps, ADR reviews, API contracts, and early design checkpoints before parallel work diverges."],
[58,4,"Explain the core practices of Kanban.","Visualize work, limit WIP, manage flow, make policies explicit, implement feedback loops, and improve collaboratively using data."],
[59,4,"Why does limiting WIP improve throughput?","Lower WIP reduces context switching, queues, and hidden bottlenecks. It helps teams finish work faster instead of starting more work than the system can absorb."],
[60,4,"How is Cycle Time different from Lead Time, and which matters more to customers?","Lead Time runs from request to delivery and is customer-facing. Cycle Time runs from work start to delivery and is team-facing. Customers usually care more about Lead Time."],
[61,4,"How would you use a Cumulative Flow Diagram to diagnose a bottleneck?","I look for widening bands, which show work accumulating in a stage. That indicates downstream capacity, policy, or dependency constraints slowing flow."],
[62,4,"What are the seven wastes of Lean in software?","Partially done work, extra features, relearning, handoffs, task switching, delays, and defects."],
[63,4,"Explain MVP from a Lean perspective.","An MVP is the smallest experiment that validates a learning hypothesis with real users. It is not simply a poorly featured version of the final product."],
[64,4,"What are the core levels of SAFe?","Team, Program or ART, Large Solution, and Portfolio. Essential SAFe focuses on Team and ART; Full SAFe includes all levels."],
[65,4,"What is an Agile Release Train in SAFe?","An ART is a long-lived team of agile teams aligned to a shared mission, cadence, backlog, and value stream, typically 50-125 people."],
[66,4,"What is the role of a Release Train Engineer?","The RTE is the chief facilitator and servant leader for the ART, enabling PI Planning, flow, dependency resolution, risk escalation, and continuous improvement."],
[67,4,"How does WSJF prioritization work?","Weighted Shortest Job First ranks work by Cost of Delay divided by job size. It favors high-value, time-critical, risk-reducing work that can be delivered quickly."],
[68,4,"What problem does Nexus solve?","Nexus coordinates 3-9 Scrum Teams working from one Product Backlog toward one Integrated Increment, with explicit focus on integration and cross-team dependencies."],
[69,4,"How does LeSS differ philosophically from SAFe?","LeSS minimizes additional roles and structure, extending Scrum with as little overhead as possible. SAFe provides more formal coordination, portfolio, and governance layers."],
[70,4,"What is the Executive Action Team in Scrum@Scale?","The EAT removes organizational impediments that teams or Scrum of Scrums cannot resolve, such as funding, structure, policy, or leadership constraints."],
[71,4,"How do you design a hybrid model for fixed-scope contracts and agile teams?","Use fixed governance, commercial controls, and milestone reporting externally, while executing internally with agile iterations, demos, change control, and scope trade-off bands."],
[72,4,"How do you manage Waterfall contract milestones while engineering uses Scrum?","I map Sprint outputs to contractual gates, maintain traceability, produce required documents incrementally, and use a bridging plan that translates agile evidence into milestone acceptance."],
[73,5,"What are traditional SDLC phases and where does delivery management add value?","Requirements, design, build, test, deploy, and maintain. Delivery management adds most value by coordinating handoffs, risks, dependencies, scope control, and stakeholder decisions across phases."],
[74,5,"When is Waterfall genuinely a better fit than Agile?","When requirements are stable, scope is fixed, change is expensive, and compliance gates dominate, such as certain regulated, infrastructure, hardware, or contractual programs."],
[75,5,"What primary Waterfall risk does Agile mitigate?","Late discovery that requirements, design assumptions, or user expectations were wrong. Agile mitigates this through early working software and frequent feedback."],
[76,5,"How would you sequence a delivery plan for a hard regulatory audit date?","Work backward from the audit, define evidence and control checkpoints, reserve time for remediation, documentation, testing, approvals, and avoid late scope churn."],
[77,6,"What cultural shift does DevOps represent beyond tooling?","DevOps creates shared ownership across development, operations, security, and delivery for building, deploying, operating, and improving software. It replaces handoff culture with product/service ownership."],
[78,6,"Explain You Build It, You Run It and trade-offs.","Teams operating what they build gain accountability, faster feedback, and better quality. The trade-off is on-call load and the need for operational skills, tooling, and support."],
[79,6,"Difference between Continuous Integration, Delivery, and Deployment?","CI means frequent integration with automated tests. Continuous Delivery keeps software always releasable. Continuous Deployment automatically releases every passing change to production."],
[80,6,"Describe typical CI/CD stages for a web app.","Commit, build, unit tests, lint/static analysis, dependency/security scans, package artifact, integration tests, deploy to staging, smoke tests, production deploy, and post-deploy monitoring."],
[81,6,"What is a flaky test and how does it undermine CI?","A flaky test passes or fails inconsistently without code changes. It erodes trust, causes ignored failures, slows teams, and can hide real regressions."],
[82,6,"How do you handle a 45-minute test suite slowing releases?","Segment tests by speed and risk, parallelize, optimize slow tests, run fast PR gates first, move heavier suites to staged or scheduled runs, and eliminate flakiness."],
[83,6,"Explain git merge versus git rebase.","Merge combines branches with a merge commit and preserves history. Rebase replays commits onto a new base for a linear history but rewrites commit history."],
[84,6,"What is a merge conflict and what causes it?","A merge conflict occurs when Git cannot automatically reconcile incompatible changes, commonly to the same lines or overlapping file structure changes."],
[85,6,"Compare Git Flow and Trunk-Based Development for release cadence.","Git Flow uses longer-lived release and feature branches, suiting scheduled releases but increasing integration risk. Trunk-based uses short-lived branches and supports continuous delivery."],
[86,6,"What is a feature branch strategy and risk of long-lived branches?","Developers isolate work on separate branches. If branches live too long, they accumulate integration debt, merge conflicts, stale assumptions, and delayed feedback."],
[87,6,"How design branching for multiple production releases per day?","Use trunk-based development, short-lived branches, mandatory CI, small changes, feature flags, automated deployment, and fast rollback or kill-switch mechanisms."],
[88,6,"Difference between release and deploy?","Deploy means code is installed in an environment. Release means functionality is exposed to users, often controlled independently through feature flags."],
[89,6,"How do feature flags reduce release risk?","They decouple deployment from user exposure, enabling gradual rollout, A/B testing, instant disablement, and safer rollback without redeploying code."],
[90,6,"Risk of too many long-lived feature flags?","They create conditional complexity, untested flag combinations, dead code, ownership ambiguity, and operational confusion. Flags need owners and retirement dates."],
[91,6,"What criteria should trigger automatic rollback?","Pre-agreed guardrails such as error-rate spikes, latency regression, failed health checks, saturation, crash loops, or business KPI degradation versus baseline."],
[92,6,"Rollback versus roll-forward fix, and when choose each?","Rollback restores a known-good version quickly. Roll-forward patches the current path when rollback is unsafe, such as irreversible data migrations or dependency changes."],
[93,6,"Explain Blue-Green deployment and benefit.","Two production-like environments run side by side; traffic switches from blue to green. It enables low downtime and rapid rollback by switching traffic back."],
[94,6,"How does Canary differ from Blue-Green, and when prefer it?","Canary gradually exposes a new version to a small cohort before full rollout. Prefer it when real-user validation and blast-radius reduction are important."],
[95,6,"What metrics monitor during canary rollout?","Compare canary versus baseline for error rate, latency, saturation, logs, conversion, revenue, support tickets, and domain-specific business KPIs."],
[96,6,"How design rollback-safe database migration?","Use expand-contract: add backward-compatible schema first, deploy code that supports old and new, backfill safely, switch reads/writes, then remove old fields later."],
[97,6,"How coordinate a release calendar across product lines sharing a platform?","Maintain a shared release calendar, platform dependency board, freeze windows, sequencing rules, change advisory where needed, and clear ownership for integration readiness."],
[98,7,"Difference between horizontal and vertical scaling?","Vertical scaling increases resources on one machine. Horizontal scaling adds more machines or instances and usually improves resilience and elasticity."],
[99,7,"Explain IaaS, PaaS, and SaaS with examples.","IaaS provides infrastructure like AWS EC2. PaaS provides managed runtime like Heroku or App Engine. SaaS provides complete applications like Salesforce."],
[100,7,"What is an SLA in cloud vendor uptime?","An SLA is a contractual availability commitment, often expressed as uptime percentage, with remedies such as service credits if the vendor breaches it."],
[101,7,"Difference between AWS Availability Zone and Region?","A Region is a geographic area. An Availability Zone is an isolated data center grouping within a Region, used for fault tolerance."],
[102,7,"What does AWS Auto Scaling do and why should a delivery manager care?","It adjusts compute capacity based on demand. Delivery managers care because it affects cost, launch readiness, performance testing, resilience, and capacity assumptions."],
[103,7,"What is Azure DevOps used for beyond source control?","Boards, Repos, Pipelines, Test Plans, Artifacts, dashboards, traceability, and end-to-end delivery management from backlog to release."],
[104,7,"What is Google Kubernetes Engine?","GKE is Google Cloud's managed Kubernetes service, providing cluster orchestration, scaling, upgrades, networking, and operations for containerized workloads."],
[105,7,"Difference between Docker image and container?","An image is the immutable packaged template. A container is a running instance of that image with its own process and runtime environment."],
[106,7,"Why do containers improve delivery consistency?","They package application code and dependencies consistently across environments, reducing configuration drift and the classic works-on-my-machine problem."],
[107,7,"What problem does Kubernetes solve that plain Docker does not?","Kubernetes orchestrates containers across clusters: scheduling, scaling, service discovery, networking, rollout, self-healing, and resource management."],
[108,7,"Explain a Kubernetes Pod.","A Pod is the smallest deployable Kubernetes unit, containing one or more tightly coupled containers sharing network namespace, storage, and lifecycle."],
[109,7,"Difference between load balancer and reverse proxy?","A load balancer distributes traffic across backend instances. A reverse proxy sits in front of services to route, terminate TLS, cache, authenticate, or transform requests."],
[110,8,"What does REST stand for and what are key constraints?","Representational State Transfer. Key constraints include statelessness, client-server separation, uniform interface, cacheability, layered system, and optional code-on-demand."],
[111,8,"Difference between PUT and PATCH?","PUT usually replaces the full resource representation idempotently. PATCH applies a partial update to selected fields or operations."],
[112,8,"What problem does GraphQL solve that REST often does not?","GraphQL reduces over-fetching and under-fetching by letting clients request exactly the fields they need, often across related resources in one query."],
[113,8,"Trade-off of GraphQL versus REST operationally?","GraphQL can complicate HTTP caching, monitoring, rate limiting, authorization, and query cost control because requests are dynamic and flexible."],
[114,8,"Compare URI versioning versus header-based API versioning.","URI versioning is explicit and easy to test but clutters endpoints. Header versioning is cleaner but less discoverable and can be harder for consumers."],
[115,8,"How plan a breaking API change without disrupting integrations?","Introduce a new version in parallel, publish migration guides, notify consumers, track adoption, support both temporarily, and enforce a clear sunset date."],
[116,8,"Difference between authentication and authorization?","Authentication verifies who the user or service is. Authorization determines what that identity is allowed to access or perform."],
[117,8,"Explain RBAC versus ABAC.","RBAC grants permissions through predefined roles. ABAC evaluates attributes such as user, resource, action, environment, location, and context for finer-grained decisions."],
[118,8,"What problem does OAuth 2.0 solve?","It lets users grant third-party applications limited delegated access to resources without sharing credentials, using tokens and defined authorization flows."],
[119,8,"Access Token versus Refresh Token?","An access token is short-lived and used to call APIs. A refresh token is longer-lived and used to obtain new access tokens securely."],
[120,8,"What is a JWT and its three parts?","A JSON Web Token is a compact signed token containing claims. It has a header, payload, and signature."],
[121,8,"Risk of storing sensitive data unencrypted in JWT payload?","JWT payloads are base64url-encoded, not encrypted by default. Anyone with the token can decode and read sensitive claims."],
[122,8,"Difference between INNER JOIN and LEFT JOIN?","INNER JOIN returns only rows with matches in both tables. LEFT JOIN returns all rows from the left table plus matching right rows or nulls."],
[123,8,"What is normalization and why denormalize?","Normalization structures data to reduce redundancy and anomalies. Denormalization intentionally duplicates or reshapes data to improve read performance or simplify queries."],
[124,8,"When choose NoSQL over relational?","When flexible schema, massive horizontal scale, high write throughput, document/key-value access, or availability patterns matter more than complex joins and strict relational integrity."],
[125,8,"What is CAP theorem and why matter?","During network partitions, distributed systems must trade off consistency and availability. It matters because architecture must match business tolerance for stale data or downtime."],
[126,8,"What is a database index and trade-off?","An index speeds lookups, filters, joins, and sorting by maintaining auxiliary data structures. It costs extra storage and slows writes/updates."],
[127,8,"What is Redis commonly used for?","Redis is used for in-memory caching, sessions, rate limiting, distributed locks, queues, leaderboards, counters, and pub/sub-style messaging."],
[128,8,"What problem does Kafka solve for event-driven systems?","Kafka provides durable, ordered, high-throughput event streams that decouple producers and consumers and allow replay of historical events."],
[129,8,"Difference between Kafka topic and partition?","A topic is a logical event stream. Partitions split a topic for scalability and guarantee ordering only within each partition."],
[130,8,"RabbitMQ queue model versus Kafka log model?","RabbitMQ routes messages to queues for consumption and acknowledgement. Kafka stores an append-only retained log where consumers track offsets and can replay."],
[131,8,"Benefit of event-driven architecture for cross-team delivery?","Teams integrate through published events and contracts rather than synchronous handoffs, reducing coupling, blocking dependencies, and coordinated release pressure."],
[132,8,"Explain cache invalidation and why it is hard.","Cache invalidation decides when cached data is stale and must be refreshed. It is hard because data changes across systems, timing, replication, and user expectations rarely align perfectly."],
[133,9,"Benefits and costs of microservices from delivery perspective?","Benefits include independent deployment, scaling, ownership, and fault isolation. Costs include distributed complexity, observability needs, data consistency challenges, and cross-service coordination."],
[134,9,"When not migrate from monolith to microservices?","Do not migrate when the team is small, domain boundaries are unclear, deployment maturity is weak, observability is poor, or the monolith is not yet constraining delivery."],
[135,9,"What is a distributed monolith and why worse?","It is a set of services that are tightly coupled and must change or deploy together. It adds network and operational complexity without independent delivery benefits."],
[136,9,"What is Single Responsibility Principle and why matter to delivery?","A component should have one reason to change. It reduces change blast radius, simplifies testing, improves ownership, and lowers coordination cost."],
[137,9,"How facilitate an Architecture Decision Record process?","Use lightweight ADRs capturing context, options, decision, consequences, owner, and date. Review important decisions collaboratively and store ADRs where teams can find them."],
[138,9,"High-level design for URL shortener service.","Generate unique short codes, store code-to-long-URL mappings, redirect reads through a fast lookup/cache, handle collisions, track analytics asynchronously, and scale for read-heavy traffic."],
[139,9,"Vertical partitioning versus horizontal partitioning?","Vertical partitioning splits data by columns or functional domains. Horizontal partitioning, or sharding, splits rows across databases by key."],
[140,9,"Explain eventual consistency and acceptable example.","Eventual consistency means replicas may temporarily differ but converge over time. It is acceptable for likes, feeds, analytics, or non-critical counters."],
[141,9,"What problem does Circuit Breaker solve?","It stops repeated calls to a failing dependency, preventing resource exhaustion and cascading failure while giving the downstream service time to recover."],
[142,9,"Explain Strangler Fig pattern.","Incrementally route functionality from a legacy system to a new system, feature by feature, until the legacy system can be retired."],
[143,9,"What is Saga pattern and why used?","A Saga coordinates multiple local transactions using events or orchestration plus compensating actions. It avoids fragile distributed transactions across services."],
[144,9,"How evaluate if architecture is over-engineered?","Compare complexity to actual scale, risk, team capability, and near-term requirements. Challenge speculative flexibility that adds cost without measurable benefit."],
[145,9,"Synchronous versus asynchronous service communication and trade-offs?","Synchronous calls are simple and immediate but couple availability and latency. Asynchronous messaging improves resilience and decoupling but adds eventual consistency and operational complexity."],
[146,9,"How explain architecture trade-offs to non-technical stakeholders?","Translate choices into business impact: delivery speed, rework cost, outage risk, compliance exposure, scalability, operational cost, and future flexibility."],
[147,9,"How approach capacity planning for 10x launch traffic?","Model expected load, load test critical paths, identify bottlenecks, tune autoscaling, pre-warm caches, validate database limits, prepare rollback, and staff launch support."],
[148,10,"Difference between monitoring and observability?","Monitoring tracks known signals and alerts on expected failure modes. Observability enables investigation of unknown problems through rich telemetry, correlation, and exploration."],
[149,10,"What are the three pillars of observability?","Logs, metrics, and traces. Together they show what happened, how much, and where a request traveled."],
[150,10,"What is distributed tracing and why matter?","Distributed tracing follows a request across services, showing latency and failures at each hop. It is essential for diagnosing microservice performance and dependency issues."],
[151,10,"First 15 minutes of a Sev1 incident?","Declare the incident, assign Incident Commander, open bridge/chat, start timeline, confirm impact, assign communications and technical leads, stabilize first, and decide rollback or mitigation."],
[152,10,"Role of Incident Commander during major outage?","The Incident Commander coordinates response, prioritizes actions, manages communication, keeps timeline, removes distractions, and makes decisions. They should not be the main debugger."],
[153,10,"What is Five Whys and limitation?","Five Whys repeatedly asks why to move from symptom to cause. Its limitation is oversimplifying complex, multi-causal, systemic failures."],
[154,10,"Why should post-incident review be blameless and how enforce?","Blame suppresses truth and learning. Enforce by focusing on systems, decisions, signals, constraints, and process improvements rather than individual fault."],
[155,10,"How structure on-call rotation to avoid burnout on small team?","Use fair primary/secondary rotations, clear escalation, runbooks, compensation or time off, alert hygiene, office-hours coverage, and reduce pages through reliability work."],
[156,10,"Difference between runbook and playbook?","A runbook gives step-by-step technical actions. A playbook defines broader incident process, roles, communications, escalation, and decision flow."],
[157,10,"Difference between SLA, SLO, and SLI?","SLI is the measured reliability indicator. SLO is the internal target. SLA is the contractual external promise with consequences."],
[158,10,"How set SLO for new service with no history?","Start with comparable services and business expectations, set a conservative initial target, measure production behavior, then adjust through review cycles."],
[159,10,"What is an error budget?","An error budget is the allowed unreliability implied by an SLO. It balances feature velocity and reliability by defining when teams must slow down to improve stability."],
[160,10,"How handle team shipping despite exhausted error budget?","Apply the agreed policy: freeze or restrict risky changes, prioritize reliability fixes, involve product leadership, and resume normal delivery when budget recovers."],
[161,10,"How maintain a technical risk register?","Track risk description, probability, impact, owner, mitigation, contingency, status, and due date. Review regularly and escalate high-exposure risks."],
[162,10,"How write post-incident report for executives?","Use plain language: customer impact, timeline, root cause, contributing factors, recovery actions, prevention plan, owners, dates, and residual risk."],
[163,10,"How decide hotfix versus next scheduled release?","Evaluate severity, customer impact, workaround availability, regulatory/SLA exposure, fix risk, test confidence, and cost of out-of-band release."],
[164,10,"What makes a good alert versus noisy alert?","A good alert is actionable, urgent, tied to user impact, has ownership, and links to a runbook. Noisy alerts lack clear action or business meaning."],
[165,10,"How use dashboard to distinguish deployment regression from infrastructure noise?","Correlate metric changes with deploy markers, compare before/after baselines, inspect affected services, cohorts, regions, and check infrastructure-wide signals."],
[166,10,"When communicate incident externally to customers?","When there is customer-visible impact, contractual obligation, data/security concern, or transparency policy trigger. Communication should be timely, accurate, and updated as facts evolve."],
[167,10,"Value of game day or chaos engineering?","It tests resilience, alerting, runbooks, roles, and recovery procedures safely before real incidents expose weaknesses."],
[168,10,"How triage spike in customer support tickets?","Cluster by symptom, timestamp, account, region, version, and workflow; check recent deploys and telemetry; declare an incident if systemic impact is likely."],
[169,11,"How explain technical debt to business stakeholders?","It is like financial debt: taking shortcuts can speed delivery now, but interest appears later as slower changes, more defects, higher risk, and reduced flexibility."],
[170,11,"How prioritize tech debt against feature delivery?","Quantify impact on incidents, cycle time, onboarding, defect rate, and risk. Allocate capacity, tie debt items to outcomes, and prioritize high-interest debt."],
[171,11,"Difference between deliberate and inadvertent technical debt?","Deliberate debt is a conscious trade-off for speed or learning. Inadvertent debt comes from poor understanding, changing requirements, or better knowledge discovered later."],
[172,11,"Refactoring versus rewriting and when appropriate?","Refactoring improves internal structure without changing behavior and is safer incrementally. Rewriting replaces functionality wholesale and is justified only when incremental change is uneconomic or unsafe."],
[173,11,"How ensure large refactor avoids regressions?","Build characterization tests, refactor incrementally, use feature flags, monitor behavior, run parallel paths where useful, and keep rollback options."],
[174,11,"Difference between Quality Assurance and Quality Control?","QA prevents defects through process, standards, and practices. QC detects defects through inspection and testing of the product."],
[175,11,"How build quality culture where testing is not only QA's job?","Make quality part of Definition of Done, require developer-owned tests, shift left, pair QA with dev early, automate checks, and treat defects as team learning."],
[176,11,"What is the Test Pyramid and why more unit than E2E?","The pyramid favors many fast unit tests, fewer integration tests, and limited E2E tests. Unit tests are cheaper, faster, and more stable."],
[177,11,"Risk of over-investing in UI E2E automation?","UI E2E tests are slow, brittle, expensive to maintain, and often fail for reasons unrelated to product behavior, reducing pipeline trust."],
[178,11,"What makes a good unit test?","It is fast, deterministic, isolated, readable, focused on one behavior, independent of external systems, and meaningful when it fails."],
[179,11,"What is TDD and delivery benefit?","TDD writes a failing test before code, then implements and refactors. It provides design feedback, regression safety, and clearer expected behavior."],
[180,11,"Integration testing versus contract testing?","Integration testing validates actual components working together. Contract testing verifies provider-consumer API compatibility without requiring full end-to-end environments."],
[181,11,"How test a service depending on third-party API?","Use mocks/stubs for routine tests, provider sandbox for integration, contract tests where possible, fault injection for timeouts/errors, and periodic validation against production-like behavior."],
[182,11,"Strategy to keep E2E tests fast on every PR?","Run critical-path smoke E2E tests in parallel on PRs, tag slower tests for nightly or pre-release runs, and remove duplicate coverage."],
[183,11,"Difference between load testing and stress testing?","Load testing validates expected traffic levels. Stress testing exceeds expected capacity to discover limits, degradation behavior, and breaking points."],
[184,11,"How incorporate performance testing into CI/CD without slowing deploys?","Run lightweight performance smoke tests per build and schedule full load/stress tests nightly, pre-release, or for high-risk changes."],
[185,11,"How handle QA as bottleneck at sprint end?","Shift testing left, involve QA in refinement, automate regression, slice stories smaller, enforce dev test ownership, and limit WIP into QA."],
[186,11,"How make business case for two-sprint tech-debt initiative?","Show current cost using incidents, cycle time, support load, defect leakage, and delivery drag. Present expected measurable improvement and risk reduction."],
[187,12,"What is least privilege and why matter for pipelines?","Grant only the minimum access required. In pipelines it limits blast radius if credentials, build agents, or deployment automation are compromised."],
[188,12,"Encryption at rest versus in transit?","At rest protects stored data on disks, databases, and backups. In transit protects data moving over networks, typically using TLS."],
[189,12,"What is OWASP Top 10 and why should a delivery manager know it?","It is a list of major web application security risks. Delivery managers use it to prioritize security work, plan gates, and communicate risk."],
[190,12,"Explain SQL Injection and prevention.","SQL Injection occurs when untrusted input changes query logic. Prevent it with parameterized queries, prepared statements, input validation, least privilege, and safe ORM use."],
[191,12,"What does shifting security left mean?","It means integrating security early in the SDLC through threat modeling, secure design, code scanning, dependency checks, and developer education."],
[192,12,"How add security review gate without slowing delivery?","Automate SAST, dependency, secret, and container scans in CI; set risk-based thresholds; reserve manual review for high-risk changes."],
[193,12,"High-level GDPR obligations for delivery teams?","Data minimization, lawful processing, consent/rights handling, access and erasure requests, privacy by design, breach notification, and protection of personal data."],
[194,12,"How does right to be forgotten affect architecture and backlog?","Systems must locate, delete, anonymize, or suppress personal data across services, logs, analytics, backups, and downstream processors, requiring explicit backlog capacity."],
[195,12,"What does SOC 2 assess and why hard roadmap deadline?","SOC 2 assesses controls for security, availability, confidentiality, processing integrity, and privacy. It often drives sales, enterprise readiness, and contractual deadlines."],
[196,12,"What is ISO 27001 concerned with?","ISO 27001 defines an Information Security Management System for identifying risks, implementing controls, auditing, and continuously improving security governance."],
[197,12,"How respond to vulnerability two days before major launch?","Assess severity, exploitability, exposure, and mitigation. Patch or mitigate urgently, involve security/legal/product, decide launch impact transparently, and document residual risk."],
[198,13,"What are the four DORA metrics?","Deployment Frequency, Lead Time for Changes, Change Failure Rate, and Time to Restore Service."],
[199,13,"What distinguishes Elite from Low performers on DORA metrics?","Elite performers deploy on demand, have short lead times, low change failure, and fast recovery. Low performers deploy infrequently, recover slowly, and carry larger batches."],
[200,13,"Why are deployment frequency and stability not a trade-off?","High performers use automation, small batches, trunk-based development, tests, observability, and fast rollback, which improves both speed and stability."],
[201,13,"Risk of individual developer commit counts as productivity metric?","It incentivizes gaming, ignores complexity and collaboration, discourages refactoring/review, and can reward noisy activity over valuable outcomes."],
[202,13,"What is Cycle Time and how identify bottleneck?","Cycle Time measures work start to completion. Break it down by workflow stage to see where items wait longest or queues grow."],
[203,13,"What KPIs present to executives for delivery health?","Predictability, lead/cycle time, roadmap progress, quality defects, incident trend, change failure, customer impact, team health, and top risks/decisions."],
[204,13,"How measure whether release cadence improved outcomes?","Compare before/after deployment frequency, lead time, change failure, MTTR, escaped defects, customer satisfaction, and business impact."],
[205,13,"How avoid vanity metrics in upward reporting?","Use metrics tied to decisions, risks, and outcomes. Explain trend, target, interpretation, and action rather than reporting attractive numbers in isolation."],
[206,13,"Output metrics versus outcome metrics?","Output measures activity or deliverables, such as stories completed. Outcome measures business or user impact, such as conversion, retention, reliability, or revenue."],
[207,13,"How set predictability target for team new to sprints?","Baseline actual commitment versus completion for several Sprints, identify causes of variance, then set gradual improvement targets rather than imposing an arbitrary ideal."],
[208,13,"How improve high Change Failure Rate?","Reduce batch size, strengthen automated tests, improve code review, use canaries/feature flags, enhance pre-deploy validation, and perform blameless analysis of failures."],
[209,13,"Why not use story points for cross-team performance comparison?","Points are locally calibrated and relative. Cross-team comparison creates false precision, unhealthy competition, and metric gaming."],
[210,13,"How structure monthly delivery scorecard for five programs?","Use consistent RAG, milestone progress, forecast confidence, DORA/flow trends, quality, financials if relevant, top risks, dependencies, and decisions needed."],
[211,14,"How configure Jira workflow to prevent skipping code review?","Add a code review status or transition condition, require linked PR approval and passing checks before moving to Done, and audit exceptions."],
[212,14,"Difference between Jira Epic and Initiative?","An Epic groups related stories for a sizable feature. An Initiative groups multiple epics under a larger strategic, often multi-quarter objective."],
[213,14,"Azure DevOps Boards versus Pipelines?","Boards manages work items, backlogs, sprints, and tracking. Pipelines automates build, test, release, and deployment workflows."],
[214,14,"How structure Confluence so it avoids documentation graveyard?","Use a clear taxonomy, ownership, templates, page status, review dates, linked indexes, archive policy, and direct links from active Jira work."],
[215,14,"Purpose of GitHub Actions beyond deploys?","GitHub Actions automates CI/CD and workflow tasks such as release notes, dependency scanning, issue triage, labeling, environment checks, and compliance evidence."],
[216,14,"Advantage of GitLab integrated CI/CD?","Source, issues, pipelines, security scans, artifacts, and deployments are tightly connected, reducing handoff friction and improving traceability."],
[217,14,"How use Azure DevOps for five-team dependencies?","Link work items across teams, use feature/epic hierarchy, dependency views or delivery plans, shared milestones, tags, and a program-level board."],
[218,14,"Purpose of GitHub branch protection rules and production settings?","They enforce quality gates before merge. For production I require PR reviews, passing status checks, up-to-date branches, signed commits if needed, and restricted admin bypass."],
[219,14,"How use Confluence with Jira to sync requirements and execution?","Store rich requirements and decisions in Confluence, link them to Jira epics/stories, embed Jira reports, and keep ownership and review cadence clear."],
[220,15,"How is AI changing the delivery manager role?","AI accelerates drafting updates, summarizing risks, analyzing delivery data, preparing meeting notes, triaging incidents, and detecting patterns. The manager still validates judgment and context."],
[221,15,"Risks of relying on AI-generated code without review?","AI code may contain subtle bugs, security flaws, license/IP issues, poor fit to architecture, and plausible but incorrect implementations."],
[222,15,"How adjust Definition of Done for AI-assisted code?","Require human review, tests, security/dependency checks, explainability of generated logic, license compliance, and ownership by the submitting developer."],
[223,15,"How might an LLM help triage incidents?","It can summarize alerts/logs, cluster symptoms, compare against historical incidents, draft communications, suggest hypotheses, and create timeline notes, subject to human validation."],
[224,15,"Current limitation of LLMs for automated RCA?","LLMs can hallucinate plausible causes and lack true system grounding unless connected to reliable telemetry, topology, deployment, and incident data."],
[225,15,"How write prompt for executive status update from sprint data?","Provide structured facts, audience, tone, format, length, RAG criteria, completed work, risks, dependencies, decisions needed, and ask it not to invent missing data."],
[226,15,"Risk of AI-generated stakeholder communications without review?","Incorrect facts, confidential leakage, poor tone, missing nuance, or overconfidence can damage trust. Human review is mandatory for external or executive communication."],
[227,15,"How evaluate introducing AI coding assistant?","Run a controlled pilot, define security/IP policy, measure cycle time, quality, developer satisfaction, review load, defect rate, and expand only if benefits outweigh risks."],
[228,16,"A deploy just went out and error rates are climbing. Next five minutes?","Declare incident if thresholds are met, confirm deploy correlation, open incident channel, assign roles, check dashboards/logs, decide rollback versus flag disablement, and start stakeholder comms."],
[229,16,"During Sev1, two engineers propose conflicting fixes. How decide?","As Incident Commander, compare reversibility, speed, risk, confidence, and blast radius. Prefer the safest reversible mitigation, timebox investigation, and avoid parallel chaos."],
[230,16,"CI pipeline suddenly fails for all branches after months. Diagnose?","Check shared dependencies first: runner infrastructure, credentials, base images, external services, pipeline config, certificates, and dependency updates. Re-run a known-good commit to isolate."],
[231,16,"Microservice latency crept up 40 percent over two weeks. Approach?","Inspect data growth, dependency latency, resource saturation, query plans, cache hit rate, configuration drift, traffic mix, background jobs, and gradual error/retry patterns."],
[232,16,"Whiteboard delivery plan for monolith to microservices over 12 months.","Assess domains, choose migration seams, build platform/observability, apply Strangler pattern, migrate low-risk capabilities first, manage data boundaries, and measure business-risk reduction."],
[233,16,"Draw CI/CD pipeline for new greenfield service.","Commit triggers build, unit tests, lint, SAST/dependency scan, package artifact, integration tests, deploy to staging, smoke test, approval if needed, deploy production, monitor."],
[234,16,"Client release slips every sprint by days. Diagnose pattern?","Review estimation, carryover, scope churn, dependencies, QA bottlenecks, environment issues, unplanned work, decision latency, and whether commitments exceed true capacity."],
[235,16,"Three teams have different Definitions of Done. First move?","Facilitate a joint quality alignment workshop, identify minimum shared DoD, handle legitimate team-specific additions, and make release readiness criteria explicit."],
[236,16,"Velocity dropped 30 percent after senior engineers left; leadership wants same date. Respond?","Present capacity evidence and revised forecast, explain risk, and negotiate scope, timeline, staffing, or quality trade-offs. I would not hide the gap."],
[237,16,"Vendor critical API keeps missing dates. Manage risk?","Escalate with evidence, obtain revised commitments, add contractual pressure if applicable, build mocks/contingency, adjust plan, and evaluate alternate integration paths."],
[238,16,"Rollback fails; old version has same bug. What now?","Reassess assumptions, keep incident active, seek mitigation such as feature flag, config change, traffic shaping, data fix, or roll-forward patch, and update stakeholders."],
[239,16,"Dashboards misconfigured and hid issue for two hours. Post-mortem handling?","Treat monitoring failure as a contributing system factor, not blame. Add dashboard validation, alert tests, ownership, and observability readiness to the action plan."],
[240,16,"Two teams both claim ownership of recurring bug and neither fixes it. Break deadlock?","Convene joint RCA, use evidence to assign single accountable owner, define support roles, deadline, escalation path, and prevention action."],
[241,16,"Whiteboard dependency map for backend, frontend, and data pipeline release.","Show data schema/pipeline readiness first, backend API contract and service second, frontend integration third, with contract tests, test data, milestones, and fallback points."],
[242,16,"Stakeholder adds major feature two weeks before fixed launch. Handle?","Quantify impact on scope, quality, date, and risk. Offer options: defer to fast-follow, swap scope, reduce acceptance, or formally accept launch risk."],
[243,16,"Team meets sprint commitments but stakeholders do not trust delivery. Diagnose?","Check visibility, expectation alignment, roadmap predictability, quality, surprise changes, reporting clarity, and whether delivered work maps to stakeholder outcomes."],
[244,16,"Critical security vulnerability live for six months. Immediate action?","Activate security incident process, assess exposure and exploitation, patch or mitigate urgently, preserve evidence, involve legal/compliance, communicate per obligations, and perform RCA."],
[245,16,"Executive interrupts engineers on incident bridge. Handle in moment?","Respectfully redirect: create a separate executive update channel, assign comms lead, and protect the technical bridge for responders."],
[246,16,"Third-party payment API intermittently times out. Triage and mitigate?","Check vendor status and logs, measure error patterns, enable retries with exponential backoff, circuit breaker, fallback messaging, queueing, and vendor escalation."],
[247,16,"Design on-call escalation path for six engineers across two time zones.","Use primary and secondary per region, follow-the-sun handoff, escalation timeout, incident commander path, runbooks, manager escalation, and rotation fairness."],
[248,16,"Asked to cut program timeline by 30 percent with no resources. Approach?","Present delivery math and options: reduce scope, change quality/risk profile, sequence MVP, remove dependencies, simplify solution, or accept a realistic date."],
[249,16,"Key engineer threatens to quit mid-release due to burnout. Handle delivery and person?","Prioritize wellbeing, listen, reduce immediate load, involve manager/HR appropriately, de-risk knowledge concentration, re-plan release, and avoid making them the single failure point."],
[250,16,"Newly acquired engineering team uses different delivery methodology. Approach integration?","Assess current performance and culture first, avoid imposing process, identify shared goals and interfaces, standardize only where needed, and converge incrementally with joint ownership."]
];

let sectionsList=[...defaultSections];
let DB=[];
function buildDefaultDB(){return rawData.map(([n,c,q,a])=>({id:`Q${String(n).padStart(3,"0")}`,sectionTitle:sectionsList[c]||`Section ${c+1}`,cat:catMap[c]||"General",q,hint:a.slice(0,140),a}));}
DB=buildDefaultDB();

let activeCat="all",activeSection="all",searchTerm="",statusFilterValue="all",visibleCount=50;
const PAGE=50;
let openSet=new Set();
let masteredSet=new Set(JSON.parse(localStorage.getItem("sdm_mastered")||"[]"));
let bookmarkedSet=new Set(JSON.parse(localStorage.getItem("sdm_bookmarked")||"[]"));

const $=id=>document.getElementById(id);
const els={metricTotal:$("metricTotal"),metricMastered:$("metricMastered"),metricBookmarked:$("metricBookmarked"),metricPercent:$("metricPercent"),globalProgressBar:$("globalProgressBar"),searchInput:$("searchInput"),statusFilter:$("statusFilter"),sectionsSidebar:$("sectionsSidebar"),questionsContainer:$("questionsContainer"),loadJsonBtn:$("loadJsonBtn"),jsonFileInput:$("jsonFileInput"),exportJsonBtn:$("exportJsonBtn"),clearCustomBtn:$("clearCustomBtn"),fileNameLabel:$("fileNameLabel"),toast:$("toast"),themeToggle:$("themeToggle"),drawer:$("drawer"),drawerOverlay:$("drawerOverlay"),drawerBtn:$("drawerBtn"),closeDrawer:$("closeDrawer"),toTop:$("toTop")};

function showToast(msg,type="info"){els.toast.textContent=msg;els.toast.className=`fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm z-[90] px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type==="error"?"bg-red-600 text-white":"bg-slate-900 text-white dark:bg-white dark:text-slate-900"}`;clearTimeout(showToast._t);showToast._t=setTimeout(()=>els.toast.classList.add("hidden"),3000);}
function saveState(){localStorage.setItem("sdm_mastered",JSON.stringify([...masteredSet]));localStorage.setItem("sdm_bookmarked",JSON.stringify([...bookmarkedSet]));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function highlight(text,term){if(!term)return esc(text);const safe=esc(text);const t=term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");try{return safe.replace(new RegExp("("+t+")","ig"),"<mark>$1</mark>");}catch(e){return safe;}}

function normalizeJson(parsed){
  let arr=null,sectionsFromFile=null;
  if(Array.isArray(parsed))arr=parsed;
  else if(parsed&&Array.isArray(parsed.data)){arr=parsed.data;sectionsFromFile=parsed.sections||null;}
  else if(parsed&&Array.isArray(parsed.questions)){arr=parsed.questions;sectionsFromFile=parsed.sections||null;}
  else throw new Error("JSON must be an array or {data:[...]} or {questions:[...]}");
  if(!arr.length)throw new Error("File is empty");
  if(Array.isArray(arr[0])){
    return{db:arr.map((row,i)=>{const[n,c,q,a]=row;const sec=sectionsFromFile?.[c]||defaultSections[c]||`Section ${(c??0)+1}`;return{id:`Q${String(n||i+1).padStart(3,"0")}`,sectionTitle:sec,cat:catMap[c]||"General",q:q||"",hint:(a||"").slice(0,140),a:a||""};}),sections:sectionsFromFile||defaultSections};
  }
  const db=arr.map((o,i)=>{const q=o.q||o.question||o.title||"";const a=o.a||o.answer||o.content||"";if(!q)return null;return{id:o.id||`Q${String(i+1).padStart(3,"0")}`,sectionTitle:o.sectionTitle||o.section||o.category||"General",cat:o.cat||o.tag||"General",q,hint:o.hint||a.slice(0,140),a};}).filter(Boolean);
  if(!db.length)throw new Error("No items with a 'q' field found");
  const uniq=[...new Set(db.map(d=>d.sectionTitle))];
  return{db,sections:sectionsFromFile||(uniq.length?uniq:defaultSections)};
}
function applyCustomDB(db,sections,fileName){
  DB=db;sectionsList=sections.length?sections:defaultSections;
  openSet.clear();visibleCount=PAGE;
  localStorage.setItem("sdm_custom_db_v1",JSON.stringify({db:DB,sections:sectionsList}));
  localStorage.setItem("sdm_custom_fileName",fileName);
  els.fileNameLabel.textContent=`Custom: ${fileName} (${DB.length} Qs)`;
  els.clearCustomBtn.classList.remove("hidden");
  renderAll();showToast(`Loaded ${DB.length} questions`);
}
function tryLoadFromLocalStorage(){
  try{const raw=localStorage.getItem("sdm_custom_db_v1");if(!raw)return false;
  const p=JSON.parse(raw);if(!p.db||!p.db.length)return false;
  DB=p.db;sectionsList=p.sections||defaultSections;
  els.fileNameLabel.textContent=`Custom: ${localStorage.getItem("sdm_custom_fileName")||"file"} (${DB.length} Qs)`;
  els.clearCustomBtn.classList.remove("hidden");return true;}catch(e){return false;}
}
function handleFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const parsed=JSON.parse(e.target.result);const{db,sections}=normalizeJson(parsed);applyCustomDB(db,sections,file.name);}catch(err){showToast("Invalid JSON: "+err.message,"error");}};
  reader.readAsText(file);
}

function getFiltered(){
  const term=searchTerm.toLowerCase();
  return DB.filter(it=>{
    if(activeCat!=="all"&&it.cat!==activeCat)return false;
    if(activeSection!=="all"){
      const sIdx=String(sectionsList.indexOf(it.sectionTitle)+1).padStart(2,"0");
      if(sIdx!==activeSection)return false;
    }
    if(statusFilterValue==="bookmarked"&&!bookmarkedSet.has(it.id))return false;
    if(statusFilterValue==="mastered"&&!masteredSet.has(it.id))return false;
    if(statusFilterValue==="unmastered"&&masteredSet.has(it.id))return false;
    if(term){const blob=(it.id+" "+it.sectionTitle+" "+it.cat+" "+it.q+" "+it.a).toLowerCase();if(!blob.includes(term))return false;}
    return true;
  });
}
function sectionNumOf(it){return String(sectionsList.indexOf(it.sectionTitle)+1).padStart(2,"0");}

function renderMetrics(){const total=DB.length,m=masteredSet.size,pct=total?Math.round(m/total*100):0;els.metricTotal.textContent=total;els.metricMastered.textContent=m;$("metricMastered").nextElementSibling&&0;els.metricBookmarked.textContent=bookmarkedSet.size;els.metricPercent.textContent=pct+"%";els.globalProgressBar.style.width=pct+"%";}

function renderSidebar(){
  const groups={};DB.forEach(it=>{const k=sectionNumOf(it);if(!groups[k])groups[k]={title:it.sectionTitle,count:0,mastered:0};groups[k].count++;if(masteredSet.has(it.id))groups[k].mastered++;});
  const keys=Object.keys(groups).sort();
  const btn=(k,label,count,mastered,active)=>`<button data-section="${k}" class="section-btn w-full min-h-[44px] text-left px-3 py-2 rounded-xl text-sm transition active:scale-[.98] ${active?"bg-brand-600 text-white font-semibold shadow":"bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"}"><span class="flex justify-between items-center gap-2"><span class="truncate">${label}</span><span class="text-[11px] shrink-0 ${active?"text-white/80":"text-slate-400"}">${mastered}/${count}</span></span>${k!=="all"?`<span class="block mt-1.5 h-1 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><span class="block h-full bg-emerald-500" style="width:${count?Math.round(mastered/count*100):0}%"></span></span>`:""}</button>`;
  els.sectionsSidebar.innerHTML=btn("all","All Sections",DB.length,masteredSet.size,activeSection==="all")+keys.map(k=>{const g=groups[k];return btn(k,`${k} — ${esc(g.title)}`,g.count,g.mastered,activeSection===k);}).join("");
  els.sectionsSidebar.querySelectorAll(".section-btn").forEach(b=>b.addEventListener("click",()=>{activeSection=b.dataset.section;visibleCount=PAGE;renderSidebar();renderQuestions();if(window.innerWidth<1024)closeDrawerFn();}));
}

function renderQuestions(){
  const filtered=getFiltered();
  const shown=filtered.slice(0,visibleCount);
  const remaining=filtered.length-shown.length;
  let html=`<div class="flex items-center justify-between gap-2 sticky top-[57px] sm:top-[65px] z-20 bg-slate-50/95 dark:bg-slate-950/95 backdrop-blur py-2 -mt-1">
    <p class="text-xs sm:text-sm text-slate-500">Showing <b>${shown.length}</b> of ${filtered.length}</p>
    <div class="flex gap-1.5">
      <button id="expandAll" class="min-h-[36px] px-3 text-xs rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 active:scale-95 transition">Expand</button>
      <button id="collapseAll" class="min-h-[36px] px-3 text-xs rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 active:scale-95 transition">Collapse</button>
    </div></div>`;
  if(!filtered.length){html+=`<div class="bg-white dark:bg-slate-900 p-10 rounded-xl border border-dashed text-center text-slate-500">No matching questions</div>`;}
  else{
    html+=shown.map(it=>{
      const isM=masteredSet.has(it.id),isB=bookmarkedSet.has(it.id);
      return `<div class="bg-white dark:bg-slate-900 rounded-xl border ${isM?"border-emerald-300 dark:border-emerald-800":"border-slate-200 dark:border-slate-800"} shadow-sm overflow-hidden">
        <div class="p-3.5 sm:p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5 min-w-0">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 shrink-0">${it.id}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-100 dark:border-blue-900 shrink-0">${esc(it.cat)}</span>
              <span class="text-[11px] text-slate-500 truncate">${esc(it.sectionTitle)}</span>
            </div>
            <div class="flex gap-1.5 shrink-0">
              <button data-action="bookmark" data-id="${it.id}" aria-label="Bookmark" class="w-10 h-10 -m-1 rounded-xl flex items-center justify-center active:scale-90 transition ${isB?"text-amber-500":"text-slate-300 dark:text-slate-600"}"><i class="fa-${isB?"solid":"regular"} fa-star"></i></button>
              <button data-action="mastered" data-id="${it.id}" aria-label="Mastered" class="w-10 h-10 -m-1 rounded-xl flex items-center justify-center active:scale-90 transition ${isM?"text-emerald-500":"text-slate-300 dark:text-slate-600"}"><i class="fa-solid fa-circle-check"></i></button>
            </div>
          </div>
          <h3 class="mt-2.5 font-semibold text-[15px] sm:text-base leading-snug">${highlight(it.q,searchTerm)}</h3>
          <p class="mt-1 text-xs text-slate-500 italic line-clamp-2">${highlight(it.hint,searchTerm)}</p>
          <details data-id="${it.id}" class="mt-2.5 group"${openSet.has(it.id)?" open":""}>
            <summary class="list-none flex items-center gap-2 min-h-[40px] text-sm font-semibold text-brand-600 dark:text-blue-400 cursor-pointer select-none">
              <i class="fa-solid fa-chevron-down text-[10px] transition-transform group-open:rotate-180"></i>
              <span class="group-open:hidden">Show answer</span><span class="hidden group-open:inline">Hide answer</span>
            </summary>
            <div class="mt-1 text-sm leading-relaxed bg-slate-50 dark:bg-slate-800/50 p-3 rounded-lg border border-slate-100 dark:border-slate-800">${highlight(it.a,searchTerm)}</div>
          </details>
        </div></div>`;
    }).join("");
    if(remaining>0)html+=`<button id="loadMoreBtn" class="w-full min-h-[48px] rounded-xl bg-brand-600 text-white font-semibold text-sm active:scale-[.99] transition">Load ${Math.min(PAGE,remaining)} more <span class="opacity-75">(${remaining} left)</span></button>`;
  }
  els.questionsContainer.innerHTML=html;

  els.questionsContainer.querySelectorAll("details[data-id]").forEach(d=>d.addEventListener("toggle",()=>{d.open?openSet.add(d.dataset.id):openSet.delete(d.dataset.id);}));
  els.questionsContainer.querySelectorAll("[data-action]").forEach(btn=>btn.addEventListener("click",()=>{
    const id=btn.dataset.id;
    if(btn.dataset.action==="bookmark"){bookmarkedSet.has(id)?bookmarkedSet.delete(id):bookmarkedSet.add(id);}
    else{masteredSet.has(id)?masteredSet.delete(id):masteredSet.add(id);}
    saveState();renderMetrics();renderSidebar();
    btn.querySelector("i").className=btn.dataset.action==="bookmark"?`fa-${bookmarkedSet.has(id)?"solid":"regular"} fa-star`:"fa-solid fa-circle-check";
    btn.className=btn.className.replace(/text-(amber|emerald|slate|indigo)-\d00|dark:text-slate-\d00/g,"").trim();
    btn.classList.add(bookmarkedSet.has(id)&&btn.dataset.action==="bookmark"?"text-amber-500":masteredSet.has(id)&&btn.dataset.action==="mastered"?"text-emerald-500":"text-slate-300");
    if(btn.dataset.action==="mastered")btn.classList.toggle("dark:text-slate-600",!masteredSet.has(id));
  }));
  $("loadMoreBtn")?.addEventListener("click",()=>{visibleCount+=PAGE;renderQuestions();});
  $("expandAll")?.addEventListener("click",()=>els.questionsContainer.querySelectorAll("details[data-id]").forEach(d=>{d.open=true;openSet.add(d.dataset.id);}));
  $("collapseAll")?.addEventListener("click",()=>els.questionsContainer.querySelectorAll("details[data-id]").forEach(d=>{d.open=false;openSet.delete(d.dataset.id);}));
}
function renderAll(){renderMetrics();renderSidebar();renderQuestions();}

/* drawer */
function openDrawerFn(){els.drawer.classList.remove("-translate-x-full");els.drawerOverlay.classList.remove("hidden");document.body.style.overflow="hidden";}
function closeDrawerFn(){els.drawer.classList.add("-translate-x-full");els.drawerOverlay.classList.add("hidden");document.body.style.overflow="";}
els.drawerBtn.addEventListener("click",openDrawerFn);
els.closeDrawer.addEventListener("click",closeDrawerFn);
els.drawerOverlay.addEventListener("click",closeDrawerFn);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawerFn();});
window.addEventListener("resize",()=>{if(window.innerWidth>=1024)closeDrawerFn();});

/* events */
els.searchInput.addEventListener("input",e=>{searchTerm=e.target.value;visibleCount=PAGE;renderQuestions();});
els.statusFilter.addEventListener("change",e=>{statusFilterValue=e.target.value;visibleCount=PAGE;renderQuestions();});
document.querySelectorAll(".cat-pill").forEach(p=>p.addEventListener("click",()=>{
  document.querySelectorAll(".cat-pill").forEach(x=>{x.classList.remove("bg-brand-600","text-white");x.classList.add("bg-slate-100","dark:bg-slate-800");});
  p.classList.add("bg-brand-600","text-white");p.classList.remove("bg-slate-100","dark:bg-slate-800");
  activeCat=p.dataset.category;visibleCount=PAGE;renderQuestions();
}));
els.loadJsonBtn.addEventListener("click",()=>els.jsonFileInput.click());
els.jsonFileInput.addEventListener("change",e=>{handleFile(e.target.files[0]);e.target.value="";});
els.exportJsonBtn.addEventListener("click",()=>{
  const out=DB.map(o=>({id:o.id,q:o.q,a:o.a,sectionTitle:o.sectionTitle,cat:o.cat}));
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="questions-export.json";a.click();URL.revokeObjectURL(url);
  showToast("Exported "+out.length+" questions");
});
els.clearCustomBtn.addEventListener("click",()=>{
  if(!confirm("Restore the default 250 questions?"))return;
  localStorage.removeItem("sdm_custom_db_v1");localStorage.removeItem("sdm_custom_fileName");
  sectionsList=[...defaultSections];DB=buildDefaultDB();openSet.clear();visibleCount=PAGE;
  els.fileNameLabel.textContent="";els.clearCustomBtn.classList.add("hidden");
  renderAll();showToast("Default restored");
});
els.themeToggle.addEventListener("click",()=>{document.documentElement.classList.toggle("dark");localStorage.setItem("sdm_theme",document.documentElement.classList.contains("dark")?"dark":"light");});
window.addEventListener("dragover",e=>{e.preventDefault();});
window.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleFile(f);});
window.addEventListener("scroll",()=>{if(window.scrollY>500){els.toTop.classList.remove("hidden");els.toTop.classList.add("flex");}else{els.toTop.classList.add("hidden");els.toTop.classList.remove("flex");}},{passive:true});
els.toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

/* init */
if(localStorage.getItem("sdm_theme")==="light")document.documentElement.classList.remove("dark");
if(!tryLoadFromLocalStorage()){DB=buildDefaultDB();}
renderAll();
</script>
</body>
